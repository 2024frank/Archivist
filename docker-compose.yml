services:
  archivist-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ARCHIVIST_DB_NAME}
      POSTGRES_USER: ${ARCHIVIST_DB_USER}
      POSTGRES_PASSWORD: ${ARCHIVIST_DB_PASSWORD}
    volumes:
      - archivist-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARCHIVIST_DB_USER} -d ${ARCHIVIST_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  archivist-api:
    build: ./api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ${ARCHIVIST_STORAGE_ROOT}:${ARCHIVIST_STORAGE_ROOT}
    depends_on:
      archivist-postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - default
      - chirpstack_default

volumes:
  archivist-postgres-data:

networks:
  chirpstack_default:
    external: true
